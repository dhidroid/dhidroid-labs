<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1e293b"/>
      <stop offset="0.5" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="glow" x1="200" y1="80" x2="200" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="skin" x1="200" y1="120" x2="200" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c68642"/>
      <stop offset="1" stop-color="#8d5524"/>
    </linearGradient>
    <linearGradient id="shirt" x1="100" y1="280" x2="300" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="120" y="80" width="160" height="200" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="32" fill="url(#bg)"/>
  
  <!-- Subtle code grid pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <path d="M40 0v400M80 0v400M120 0v400M160 0v400M200 0v400M240 0v400M280 0v400M320 0v400M360 0v400"/>
    <path d="M0 40h400M0 80h400M0 120h400M0 160h400M0 200h400M0 240h400M0 280h400M0 320h400M0 360h400"/>
  </g>

  <!-- Ambient glow circle -->
  <circle cx="200" cy="180" r="140" fill="url(#glow)"/>

  <!-- Developer Silhouette / Character -->
  <!-- Shoulders & Hoodie -->
  <path d="M110 370c0-60 40-95 90-95s90 35 90 95v30H110v-30z" fill="url(#shirt)"/>
  <!-- Hoodie inner shadow / collar -->
  <path d="M165 275c12 24 23 35 35 35s23-11 35-35c-10 18-23 25-35 25s-25-7-35-25z" fill="#1e3a8a"/>

  <!-- Neck -->
  <path d="M185 220h30v60h-30z" fill="#9a6332"/>

  <!-- Head & Ears -->
  <ellipse cx="200" cy="175" rx="52" ry="62" fill="url(#skin)" filter="url(#shadow)"/>
  <ellipse cx="148" cy="178" rx="8" ry="14" fill="#a56c38"/>
  <ellipse cx="252" cy="178" rx="8" ry="14" fill="#a56c38"/>

  <!-- Hair -->
  <path d="M148 160c-2-35 22-60 52-60s54 25 52 60c-14-18-32-24-52-24s-38 6-52 24z" fill="#171717"/>
  <path d="M152 140c8-20 28-32 48-32 24 0 44 14 50 32-15-12-32-16-48-16-18 0-35 4-50 16z" fill="#262626"/>

  <!-- Minimal glasses -->
  <rect x="160" y="162" width="34" height="24" rx="6" stroke="#38bdf8" stroke-width="3" fill="#38bdf8" fill-opacity="0.1"/>
  <rect x="206" y="162" width="34" height="24" rx="6" stroke="#38bdf8" stroke-width="3" fill="#38bdf8" fill-opacity="0.1"/>
  <line x1="194" y1="174" x2="206" y2="174" stroke="#38bdf8" stroke-width="3"/>
  <line x1="150" y1="172" x2="160" y2="172" stroke="#38bdf8" stroke-width="2.5"/>
  <line x1="240" y1="172" x2="250" y2="172" stroke="#38bdf8" stroke-width="2.5"/>

  <!-- Beard / Stubble subtle -->
  <path d="M165 195c10 28 25 36 35 36s25-8 35-36c-8 12-20 20-35 20s-27-8-35-20z" fill="#171717" opacity="0.6"/>

  <!-- Floating Tech / Brand Badges -->
  <g transform="translate(48, 70)">
    <rect width="68" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="34" y="18" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">React Native</text>
  </g>
  <g transform="translate(284, 110)">
    <rect width="72" height="28" rx="14" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="36" y="18" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">TypeScript</text>
  </g>
  <g transform="translate(40, 290)">
    <rect width="56" height="28" rx="14" fill="#0f172a" stroke="#a3e635" stroke-width="1.5"/>
    <text x="28" y="18" fill="#a3e635" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Next.js</text>
  </g>
  <g transform="translate(296, 270)">
    <rect width="64" height="28" rx="14" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="32" y="18" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">AI & RAG</text>
  </g>

  <!-- Status pill -->
  <g transform="translate(135, 340)">
    <rect width="130" height="26" rx="13" fill="#166534" fill-opacity="0.85" stroke="#22c55e" stroke-width="1"/>
    <circle cx="150" cy="353" r="4" fill="#4ade80"/>
    <text x="195" y="357" fill="#f0fdf4" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">AVAILABLE FOR WORK</text>
  </g>
</svg>
