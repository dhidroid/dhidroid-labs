<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1e1b4b"/>
      <stop offset="0.5" stop-color="#172554"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cglow" x1="200" y1="100" x2="200" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#818cf8" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" rx="32" fill="url(#cbg)"/>
  <circle cx="200" cy="180" r="130" fill="url(#cglow)"/>

  <!-- Multiple Silhouettes representing team & network -->
  <!-- Left member -->
  <g opacity="0.45" transform="translate(60, 40)">
    <circle cx="90" cy="140" r="32" fill="#64748b"/>
    <path d="M40 250c0-40 25-65 50-65s50 25 50 65v20H40v-20z" fill="#475569"/>
  </g>

  <!-- Right member -->
  <g opacity="0.45" transform="translate(160, 40)">
    <circle cx="90" cy="140" r="32" fill="#64748b"/>
    <path d="M40 250c0-40 25-65 50-65s50 25 50 65v20H40v-20z" fill="#475569"/>
  </g>

  <!-- Center Leader / Handshake / Collaboration symbol -->
  <circle cx="200" cy="155" r="44" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="2"/>
  
  <g transform="translate(176, 131)">
    <!-- Handshake / Connect icon -->
    <path d="M12 28l12-12m0 0l12 12m-12-12v28" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="24" cy="8" r="6" stroke="#38bdf8" stroke-width="3"/>
  </g>

  <text x="200" y="270" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Network of Specialists</text>
  <text x="200" y="295" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">UI/UX · QA Automation · Cloud Architecture</text>

  <g transform="translate(125, 330)">
    <rect width="150" height="32" rx="16" fill="#312e81" stroke="#6366f1" stroke-width="1.5"/>
    <text x="75" y="21" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">INVITE-ONLY ROSTER</text>
  </g>
</svg>
